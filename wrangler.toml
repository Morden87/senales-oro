name = "senales-oro"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/etoro/*", "/api/*"]

# Cada 5 minutos: cada 15 min la comprobación completa (velas de 1 min, pirámide y, tras el cierre de cada hora, el sistema en dos pasos); entre medias, solo la pirámide
[triggers]
crons = ["*/5 * * * *"]

# Guarda el estado del sistema, la prueba en papel, el histórico de 1 min y la pirámide.
# Sin id: Cloudflare lo crea automáticamente en el primer despliegue.
[[kv_namespaces]]
binding = "STATE"

[vars]
NTFY_SERVER = "https://ntfy.sh"
# Fechas de la Fed añadidas a las de public/sistema.js (AAAA-MM-DD, separadas por comas).
FED_DATES = ""
# Las estadísticas de tus operaciones empiezan aquí (creación de Cortés); lo anterior se omite.
STATS_FROM = "2026-10-28T12:56:00Z"
# Pirámide: "contra" = añades un escalón cada PYR_STEP $ en tu contra (promediar); "favor" = a tu favor.
PYR_MODE = "contra"
PYR_STEP = "20"
PYR_MAX_STEPS = "5"
# Stop: un escalón más allá del último permitido. Opcional: pérdida total en $ de la pirámide que lo adelanta (0 = sin ella).
PYR_MAX_LOSS = "0"
# TP común: ganancia objetivo de la pirámide, en % de lo invertido (0 = sin TP).
PYR_TP_PCT = "5"
