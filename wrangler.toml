name = "senales-oro"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/etoro/*", "/api/*"]

# Cada 5 minutos: la comprobación completa cada 15 min y, entre medias, solo la de tu pirámide de posiciones
[triggers]
crons = ["*/5 * * * *"]

# Guarda la última recomendación para detectar el paso a ESPERAR.
# Sin id: Cloudflare lo crea automáticamente en el primer despliegue.
[[kv_namespaces]]
binding = "STATE"

[vars]
NTFY_SERVER = "https://ntfy.sh"
THRESHOLD = "0.22"
MIN_MOVE = "5"
# Las estadísticas de tus operaciones empiezan aquí (creación de Cortés); lo anterior se omite.
STATS_FROM = "2026-10-28T12:56:00Z"
# Estrategia de los avisos: "senal" = al pasar a COMPRAR, compra con SL y sin TP; mantenla aunque vuelva a ESPERAR
# y ciérrala cuando pase a VENDER. "piramide" = los avisos de escalones de abajo.
ESTRATEGIA = "senal"
SENAL_AMOUNT = "750"
SENAL_LEVERAGE = "10"
# SL en % de lo invertido (con x10, un 5 % son 0,5 % del precio, unos 20 $).
SENAL_SL_PCT = "5"
# Pirámide: "contra" = añades un escalón cada PYR_STEP $ en tu contra (promediar); "favor" = a tu favor.
PYR_MODE = "contra"
PYR_STEP = "20"
PYR_MAX_STEPS = "5"
# Stop: un escalón más allá del último permitido. Opcional: pérdida total en $ de la pirámide que lo adelanta (0 = sin ella).
PYR_MAX_LOSS = "0"
# TP común: ganancia objetivo de la pirámide, en % de lo invertido (0 = sin TP).
PYR_TP_PCT = "5"
